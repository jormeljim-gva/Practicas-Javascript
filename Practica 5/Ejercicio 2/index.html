<body>

    <h1>Cambiar color del texto</h1>

    <label for="colores">Selecciona un color:</label>
    <select id="colores" name="colores">
        <option value="green">Verde</option>
        <option value="blue">Azul</option>
        <option value="red">Rojo</option>
    </select>

    <p id="parrafo">
        Este párrafo cambiará de color con la opción seleccionada del cuadro de lista
    </p>

</body>
